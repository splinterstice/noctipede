apiVersion: apps/v1
kind: Deployment
metadata:
  name: noctipede-app
  namespace: noctipede
  labels:
    app: noctipede-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noctipede-app
  template:
    metadata:
      labels:
        app: noctipede-app
    spec:
      initContainers:
      # Wait for database to be ready
      - name: wait-for-database
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "🔍 Waiting for MariaDB to be ready..."
          until nc -z mariadb.mariadb-service 3306; do
            echo "⏳ MariaDB not ready, waiting..."
            sleep 5
          done
          echo "✅ MariaDB is ready!"
      
      # Wait for MinIO to be ready
      - name: wait-for-minio
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "🔍 Waiting for MinIO to be ready..."
          until nc -z minio-crawler-hl.minio-service 9000; do
            echo "⏳ MinIO not ready, waiting..."
            sleep 5
          done
          echo "✅ MinIO is ready!"
      
      # Initialize directories
      - name: init-directories
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "🔧 Creating directories and setting permissions..."
          mkdir -p /app/logs /app/output /app/data /app/static/ai_reports/js
          chmod 777 /app/logs /app/output /app/data
          echo "✅ Directories initialized"
        volumeMounts:
        - name: log-data
          mountPath: /app/logs
        - name: output-data
          mountPath: /app/output
        - name: data-volume
          mountPath: /app/data

      containers:
      - name: noctipede-app
        image: ghcr.io/splinterstice/noctipede:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MARIADB_HOST
          value: "mariadb.mariadb-service"
        - name: WEB_SERVER_PORT
          value: "8080"
        - name: WEB_SERVER_HOST
          value: "0.0.0.0"
        - name: SKIP_RECENT_CRAWLS
          value: "false"
        - name: MAX_CONCURRENT_CRAWLERS
          value: "10"
        # AI Reports Configuration
        - name: AI_REPORTS_ENABLED
          value: "true"
        - name: AI_REPORTS_ADVANCED
          value: "true"
        envFrom:
        - configMapRef:
            name: noctipede-config
        - secretRef:
            name: noctipede-secrets
        
        command: ['sh', '-c']
        args:
        - |
          echo "🚀 Starting Noctipede API with Advanced AI Reports..."
          cd /app
          
          echo "🗄️ Initializing database..."
          python database/init_db.py
          echo "✅ Database initialized successfully!"
          
          echo "🤖 Starting Noctipede API with AI Reports..."
          PYTHONPATH=/app python -m api.main

        volumeMounts:
        - name: output-data
          mountPath: /app/output
        - name: log-data
          mountPath: /app/logs
        - name: data-volume
          mountPath: /app/data
        - name: nfs-sites
          mountPath: /nfs-sites
        # Mount AI Reports templates
        - name: ai-reports-templates
          mountPath: /app/portal/templates/ai_reports_advanced.html
          subPath: ai_reports_advanced.html
          readOnly: true
        # Mount AI Reports JavaScript files
        - name: ai-reports-js
          mountPath: /app/static/ai_reports/js/ai_reports_advanced.js
          subPath: ai_reports_advanced.js
          readOnly: true
        - name: ai-reports-js
          mountPath: /app/static/ai_reports/js/memeclip_integration.js
          subPath: memeclip_integration.js
          readOnly: true
        # Mount AI Reports API files
        - name: ai-reports-api
          mountPath: /app/api/ai_reports_advanced.py
          subPath: ai_reports_advanced.py
          readOnly: true
        # Mount updated main.py
        - name: api-main-updated
          mountPath: /app/api/main.py
          subPath: main.py
          readOnly: true

        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 10

      volumes:
      - name: output-data
        persistentVolumeClaim:
          claimName: noctipede-output-pvc
      - name: log-data
        persistentVolumeClaim:
          claimName: noctipede-logs-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: noctipede-data-pvc
      - name: nfs-sites
        persistentVolumeClaim:
          claimName: noctipede-sites-pvc
      # AI Reports volumes
      - name: ai-reports-templates
        configMap:
          name: ai-reports-advanced-templates
      - name: ai-reports-js
        configMap:
          name: ai-reports-js-files
      - name: ai-reports-api
        configMap:
          name: ai-reports-api-files
      - name: api-main-updated
        configMap:
          name: api-main-updated
