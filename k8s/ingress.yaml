apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noctipede-http
  namespace: noctipede
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-redirectscheme@kubernetescrd
  labels:
    app: flame
spec:
  rules:
    - host: noctipede.splinterstice.celestium.life
      http:
        paths:
          - path: /api/ai-reports
            pathType: Prefix
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
          - path: /api/metrics
            pathType: Exact
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
          - path: /api/enhanced-metrics
            pathType: Exact
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
          - path: /api/health
            pathType: Exact
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: noctipede-app-service
                port:
                  number: 8080
          - path: /favicon.ico
            pathType: Exact
            backend:
              service:
                name: noctipede-app-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noctipede-https
  namespace: noctipede
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: ca-issuer
  labels:
    app: noctipede-portal
spec:
  rules:
    - host: noctipede.splinterstice.celestium.life
      http:
        paths:
          - path: /api/ai-reports
            pathType: Prefix
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
          - path: /api/metrics
            pathType: Exact
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
          - path: /api/enhanced-metrics
            pathType: Exact
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
          - path: /api/health
            pathType: Exact
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: noctipede-app-service
                port:
                  number: 8080
          - path: /favicon.ico
            pathType: Exact
            backend:
              service:
                name: noctipede-app-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noctipede-portal-service
                port:
                  number: 8080
  tls:
    - hosts:
        - noctipede.splinterstice.celestium.life
      secretName: noctipede-cert
