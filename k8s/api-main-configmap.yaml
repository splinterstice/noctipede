apiVersion: v1
kind: ConfigMap
metadata:
  name: api-main-updated
  namespace: noctipede
  labels:
    app: noctipede
    component: api
data:
  main.py: |
    """Main FastAPI application."""
    
    import uvicorn
    from contextlib import asynccontextmanager
    from datetime import datetime
    from fastapi import FastAPI, HTTPException
    from fastapi.middleware.cors import CORSMiddleware
    from fastapi.staticfiles import StaticFiles
    from fastapi.responses import JSONResponse, HTMLResponse
    from fastapi.templating import Jinja2Templates
    
    from core import setup_logging, get_logger
    from config import get_settings
    from database import get_db_manager
    from .routes import router
    from .analysis_portal import router as analysis_router
    
    # Setup logging
    setup_logging()
    logger = get_logger(__name__)
    
    # Global metrics cache
    metrics_cache = {
        "last_updated": None,
        "crawler_data": {},
        "system_data": {}
    }
    
    @asynccontextmanager
    async def lifespan(app: FastAPI):
        """Application lifespan manager."""
        # Startup
        logger.info("Starting Noctipede API")
        
        # Test database connection
        db_manager = get_db_manager()
        if not db_manager.test_connection():
            logger.error("Database connection failed")
            raise Exception("Database connection failed")
        
        # Create tables if they don't exist
        db_manager.create_tables()
        logger.info("Database initialized")
        
        yield
        
        # Shutdown
        logger.info("Shutting down Noctipede API")
    
    # Create FastAPI app
    app = FastAPI(
        title="Noctipede API",
        description="Deep Web Analysis System API",
        version="1.0.0",
        lifespan=lifespan
    )
    
    # Add CORS middleware
    app.add_middleware(
        CORSMiddleware,
        allow_origins=["*"],
        allow_credentials=True,
        allow_methods=["*"],
        allow_headers=["*"],
    )
    
    # Include routers
    app.include_router(router, prefix="/api")
    app.include_router(analysis_router, prefix="/api")
    
    # Check if AI Reports are enabled and include router
    settings = get_settings()
    if settings.ai_reports_enabled:
        try:
            from .ai_reports_advanced import router as ai_reports_router
            app.include_router(ai_reports_router, prefix="/api/ai-reports")
            logger.info("Advanced AI Reports endpoints enabled")
        except ImportError as e:
            logger.warning(f"Advanced AI Reports not available: {e}")
            try:
                from .ai_reports import router as simple_ai_reports_router
                app.include_router(simple_ai_reports_router, prefix="/api/ai-reports")
                logger.info("Simple AI Reports endpoints enabled")
            except ImportError:
                logger.warning("No AI Reports endpoints available")
    
    # Check if Ollama stats are enabled
    if hasattr(settings, 'ollama_endpoint') and settings.ollama_endpoint:
        try:
            from .ollama_stats import router as ollama_router
            app.include_router(ollama_router, prefix="/api/ollama")
            logger.info("Ollama statistics endpoints enabled")
        except ImportError as e:
            logger.warning(f"Ollama statistics not available: {e}")
    
    # Mount static files
    app.mount("/static", StaticFiles(directory="static"), name="static")
    app.mount("/output", StaticFiles(directory="output"), name="output")
    logger.info("Static files mounted at /static")
    logger.info("Output files mounted at /output")
    
    # Setup templates
    templates = Jinja2Templates(directory="portal/templates")
    
    @app.get("/", response_class=HTMLResponse)
    async def dashboard(request):
        """Main dashboard."""
        return templates.TemplateResponse("dashboard.html", {"request": request})
    
    @app.get("/enhanced", response_class=HTMLResponse)
    async def enhanced_dashboard(request):
        """Enhanced metrics dashboard."""
        return templates.TemplateResponse("enhanced_dashboard.html", {"request": request})
    
    @app.get("/combined", response_class=HTMLResponse)
    async def combined_dashboard(request):
        """Combined dashboard."""
        return templates.TemplateResponse("combined_dashboard.html", {"request": request})
    
    @app.get("/ai-reports", response_class=HTMLResponse)
    async def ai_reports_dashboard(request):
        """AI Reports dashboard."""
        return templates.TemplateResponse("ai_reports.html", {"request": request})
    
    @app.get("/ai-reports-advanced", response_class=HTMLResponse)
    async def ai_reports_advanced_dashboard(request):
        """Advanced AI Reports dashboard."""
        return templates.TemplateResponse("ai_reports_advanced.html", {"request": request})
    
    # Add metrics endpoints
    @app.get("/api/metrics")
    async def get_metrics():
        """Get comprehensive system metrics using enhanced collector."""
        try:
            # Import and use the enhanced metrics collector
            from portal.enhanced_metrics_collector import EnhancedMetricsCollector
            
            collector = EnhancedMetricsCollector()
            metrics = await collector.collect_enhanced_metrics()
            
            return {
                **metrics,
                "timestamp": datetime.utcnow().isoformat(),
                "status": "healthy"
            }
            
        except Exception as e:
            logger.error(f"Error getting enhanced metrics: {e}")
            
            # Fallback to basic metrics
            try:
                from database import get_db_session, Site, Page
                
                with get_db_session() as session:
                    total_sites = session.query(Site).count()
                    total_pages = session.query(Page).count()
                    
                    onion_sites = session.query(Site).filter(Site.is_onion == True).count()
                    i2p_sites = session.query(Site).filter(Site.is_i2p == True).count()
                    clearnet_sites = total_sites - onion_sites - i2p_sites
                    
                    return {
                        "crawler": {
                            "total_sites": total_sites,
                            "total_pages": total_pages,
                            "network_breakdown": {
                                "clearnet": clearnet_sites,
                                "onion": onion_sites,
                                "i2p": i2p_sites
                            },
                            "status": "active"
                        },
                        "timestamp": datetime.utcnow().isoformat(),
                        "status": "partial",
                        "error": f"Enhanced metrics failed: {str(e)}"
                    }
                    
            except Exception as fallback_error:
                logger.error(f"Fallback metrics also failed: {fallback_error}")
                return {
                    "error": f"All metrics collection failed: {str(e)}",
                    "fallback_error": str(fallback_error),
                    "timestamp": datetime.utcnow().isoformat(),
                    "status": "error"
                }
    
    @app.get("/api/health")
    async def health_check():
        """Health check endpoint."""
        return {
            "status": "healthy",
            "service": "noctipede-api",
            "timestamp": datetime.utcnow().isoformat()
        }
    
    @app.get("/api/ready")
    async def api_readiness_check():
        """API readiness check endpoint for Kubernetes."""
        try:
            # Check database connection
            db_manager = get_db_manager()
            if not db_manager.test_connection():
                raise HTTPException(status_code=503, detail="Database not ready")
            
            return {"status": "ready", "service": "noctipede-api"}
        except Exception as e:
            raise HTTPException(status_code=503, detail=f"Service not ready: {str(e)}")
    
    @app.exception_handler(Exception)
    async def global_exception_handler(request, exc):
        """Global exception handler."""
        logger.error(f"Unhandled exception: {exc}")
        return JSONResponse(
            status_code=500,
            content={"detail": "Internal server error"}
        )
    
    def main():
        """Run the API server."""
        settings = get_settings()
        
        uvicorn.run(
            "api.main:app",
            host=settings.web_server_host,
            port=settings.web_server_port,
            reload=False,
            log_level=settings.log_level.lower()
        )
    
    if __name__ == "__main__":
        main()
