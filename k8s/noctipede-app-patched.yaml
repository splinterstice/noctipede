apiVersion: apps/v1
kind: Deployment
metadata:
  name: noctipede-app
  namespace: noctipede
  labels:
    app: noctipede-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noctipede-app
  template:
    metadata:
      labels:
        app: noctipede-app
    spec:
      initContainers:
      - name: wait-for-database
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "🔍 Waiting for MariaDB to be ready..."
          until nc -z mariadb.mariadb-service 3306; do
            echo "⏳ MariaDB not ready, waiting..."
            sleep 5
          done
          echo "✅ MariaDB is ready!"
      - name: wait-for-minio
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "🔍 Waiting for MinIO to be ready..."
          until nc -z minio-crawler-hl.minio-service 9000; do
            echo "⏳ MinIO not ready, waiting..."
            sleep 5
          done
          echo "✅ MinIO is ready!"
      - name: init-directories
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "🔧 Creating directories and setting permissions..."
          mkdir -p /app/logs /app/output /app/data
          chmod 777 /app/logs /app/output /app/data
          echo "✅ Directories initialized"
        volumeMounts:
        - name: log-data
          mountPath: /app/logs
        - name: output-data
          mountPath: /app/output
        - name: data-volume
          mountPath: /app/data
      containers:
      - name: noctipede-app
        image: ghcr.io/splinterstice/noctipede:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: noctipede-config
        - secretRef:
            name: noctipede-secrets
        env:
        - name: MARIADB_HOST
          value: "mariadb.mariadb-service"
        - name: WEB_SERVER_PORT
          value: "8080"
        - name: WEB_SERVER_HOST
          value: "0.0.0.0"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: output-data
          mountPath: /app/output
        - name: log-data
          mountPath: /app/logs
        - name: data-volume
          mountPath: /app/data
        - name: sites-config
          mountPath: /app/data/sites.txt
          subPath: sites.txt
        - name: i2p-patch
          mountPath: /app/portal/i2p_patch.py
          subPath: i2p_patch.py
        - name: i2p-patch
          mountPath: /app/portal/patched_portal.py
          subPath: patched_portal.py
        command: ["sh", "-c"]
        args:
        - |
          echo "🚀 Starting Patched Noctipede Portal..."
          cd /app
          
          echo "🗄️ Initializing database..."
          python database/init_db.py
          echo "✅ Database initialized successfully!"
          
          echo "🩹 Starting portal with I2P optimization patch..."
          PYTHONPATH=/app python portal/patched_portal.py
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: output-data
        persistentVolumeClaim:
          claimName: noctipede-output-pvc
      - name: log-data
        persistentVolumeClaim:
          claimName: noctipede-logs-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: noctipede-data-pvc
      - name: sites-config
        configMap:
          name: sites-config
      - name: i2p-patch
        configMap:
          name: i2p-patch
