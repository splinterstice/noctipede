<!DOCTYPE html>
<html>
<head>
    <title>Test AI Reports JavaScript Parsing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>AI Reports JavaScript Test</h2>
        <button id="testBtn" class="btn btn-primary">Test Response Parsing</button>
        <div id="queryResults" class="mt-4"></div>
    </div>

    <script>
        // Test data from your actual API response
        const testResponse = {
            "success": true,
            "response": "# Noctipede Crawled Data Overview\n\n## Summary Statistics\n- **Total Sites**: 54\n- **Total Pages**: 6,090\n- **Total Media Files**: 15,721\n- **Flagged Media**: 0\n\n## Network Distribution\n- **Clearnet Sites**: 25\n- **Tor (.onion) Sites**: 27\n- **I2P Sites**: 2",
            "data": {
                "stats": {
                    "sites": 54,
                    "pages": 6090,
                    "media": 15721,
                    "flagged_media": 0
                },
                "networks": {
                    "clearnet": 25,
                    "tor": 27,
                    "i2p": 2
                },
                "recent_sites": [
                    {
                        "url": "http://bitchanr4b64govofzjthtu6qc4ytrbuwbgynapkjileajpycioikxad.onion/",
                        "network_type": "tor",
                        "last_crawled": "2025-07-11T12:37:52",
                        "page_count": 248
                    }
                ]
            },
            "error": null
        };

        // Copy the renderQueryResults method from your AI Reports JS
        function renderQueryResults(queryResult) {
            const container = document.getElementById('queryResults');
            
            // Check if this is a simple API response (has 'response' field with markdown)
            if (queryResult.response && typeof queryResult.response === 'string') {
                let html = `
                    <div class="ai-response">
                        <div class="markdown-content">
                            ${renderMarkdown(queryResult.response)}
                        </div>
                    </div>
                `;
                
                // If we have structured data, add interactive data sections
                if (queryResult.data) {
                    html += renderStructuredData(queryResult.data);
                }
                
                container.innerHTML = html;
                return;
            }
        }

        function renderMarkdown(markdown) {
            return markdown
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^\* (.*$)/gim, '<li>$1</li>')
                .replace(/^\- (.*$)/gim, '<li>$1</li>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function renderStructuredData(data) {
            console.log('renderStructuredData called with:', data);
            return `
                <div class="structured-data-section mt-4">
                    <h5 class="text-primary mb-3">Interactive Data View</h5>
                    <div class="alert alert-success">
                        <strong>Stats:</strong> ${data.stats.sites} sites, ${data.stats.pages} pages<br>
                        <strong>Networks:</strong> ${data.networks.clearnet} clearnet, ${data.networks.tor} tor, ${data.networks.i2p} i2p
                    </div>
                </div>
            `;
        }

        document.getElementById('testBtn').addEventListener('click', function() {
            console.log('Testing with response:', testResponse);
            renderQueryResults(testResponse);
        });
    </script>
</body>
</html>
